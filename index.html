<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal Document Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div class="dashboard-container">
        
        <!-- Header -->
        <header class="dashboard-header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                <span>Nexus VLM Analyzer</span>
            </div>
            <div class="header-actions">
                <span class="status-badge"><span class="pulse"></span> Engine Ready</span>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="workspace">
            
            <!-- Left Panel: Document Viewer -->
            <div class="panel left-panel">
                <div class="panel-header">
                    <h3>Document Source</h3>
                    <div class="zoom-controls">
                        <button id="btn-zoom-out">-</button>
                        <span id="zoom-level">100%</span>
                        <button id="btn-zoom-in">+</button>
                    </div>
                </div>
                <div class="panel-body">
                    <label id="upload-zone" for="file-upload" class="upload-zone">
                        <input type="file" id="file-upload" accept="image/png, image/jpeg, application/pdf, audio/*, video/*" class="hidden-input">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <p>Drag & drop document here or <strong>browse</strong></p>
                        <span class="support-text">Supports PDF, PNG, JPG, Audio, Video (Max 10MB)</span>
                    </label>

                    <div id="viewer-container" class="viewer-container hidden">
                        <div id="document-wrapper" class="document-wrapper">
                            <!-- In a real app, this img src would be dynamic. We use our mock here. -->
                            <img id="doc-image" src="Invoice_1024.png" alt="Document Preview">
                            <video id="doc-video" controls class="hidden" style="max-width: 100%; max-height: 100%; width: 100%;"></video>
                            <audio id="doc-audio" controls class="hidden" style="width: 100%; margin-top: 20%;"></audio>
                            <div id="bbox-container" class="bbox-container"></div>
                        </div>
                        
                        <!-- Overlay for scanning animation -->
                        <div id="scan-line" class="scan-line hidden"></div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Data Viewer & Controls -->
            <div class="panel right-panel">
                <div class="panel-header">
                    <h3>Extraction Pipeline</h3>
                </div>
                <div class="panel-body flex-col">
                    
                    <!-- Controls -->
                    <div class="controls-section">
                        <div class="api-keys-section">
                            <div class="config-header">
                                <h4 style="margin: 0; font-size: 0.95rem; font-weight: 600;">Configuration</h4>
                                <p style="margin: 4px 0 12px 0; font-size: 0.8rem; color: var(--text-muted);">Provide your API keys to get started.</p>
                            </div>
                            
                            <div class="input-group">
                                <label style="display: flex; justify-content: space-between;">Google Gemini API Key <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></label>
                                <div class="password-wrapper" style="position: relative;">
                                    <input type="password" id="api-key-input" class="custom-select" placeholder="Enter your key here..." style="font-family: monospace; padding-right: 36px;">
                                    <button type="button" class="btn-icon toggle-password" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); padding: 4px; background: transparent; border: none; color: var(--text-muted); cursor: pointer;">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                    </button>
                                </div>
                            </div>

                            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 16px 0;">

                            <div class="input-group">
                                <h4 style="margin: 0 0 12px 0; font-size: 0.9rem; font-weight: 600;">LangSmith Tracing (Optional)</h4>
                                <label style="display: flex; justify-content: space-between;">LangSmith API Key <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></label>
                                <div class="password-wrapper" style="position: relative;">
                                    <input type="password" id="langsmith-key-input" class="custom-select" placeholder="Enter your key here..." style="font-family: monospace; padding-right: 36px;">
                                    <button type="button" class="btn-icon toggle-password" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); padding: 4px; background: transparent; border: none; color: var(--text-muted); cursor: pointer;">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <button id="btn-analyze" class="btn primary full-width">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            Analyze Document
                        </button>
                    </div>

                    <!-- Extracted Data -->
                    <div class="data-section">
                        <div class="data-header">
                            <h4>Analysis Report</h4>
                            <span id="confidence-score" class="confidence hidden">Status: Complete</span>
                        </div>
                        <div id="data-viewer" class="data-viewer empty">
                            <div class="empty-state">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                <p>Click analyze to process document</p>
                            </div>
                        </div>
                    </div>

                    <button id="btn-download" class="btn secondary full-width disabled">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Download Report
                    </button>
                </div>
            </div>
        </div>


    </div>

    <script type="module" src="/script.js"></script>
</body>
</html>
